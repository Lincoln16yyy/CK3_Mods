l_english:
 rule_srd_vassal_courtesies:0 "Smart Realm Director: Courtesies to Vassals"
 setting_srd_vassal_courtesies_off:0 "Off"
 setting_srd_vassal_courtesies_off_desc:0 "The Director does nothing. No gold is spent and no suggestions are shown."
 setting_srd_vassal_courtesies_advisor:0 "Advisor"
 setting_srd_vassal_courtesies_advisor_desc:0 "The Director only points out a disloyal vassal worth a courtesy. Nothing is spent and nothing changes."
 setting_srd_vassal_courtesies_supervised:0 "Supervised"
 setting_srd_vassal_courtesies_supervised_desc:0 "The Director prepares the courtesy and asks for your decision. Gold is only spent if you accept."
 setting_srd_vassal_courtesies_auto:0 "Automatic"
 setting_srd_vassal_courtesies_auto_desc:0 "The Director sends the courtesy itself, as long as the treasury stays above the reserve floor."

 srd_courtesy_opinion:0 "Court courtesy"
 srd_courtesy_opinion_desc:0 "The ruler took notice of us and showed it with a gift."

 srd_toast_courtesy_title:0 "Smart Realm Director"
 srd_toast_courtesy_desc:0 "A courtesy gift was sent to a disloyal vassal."
 srd_toast_advice_title:0 "Smart Realm Director - advice"
 srd_toast_advice_desc:0 "A disloyal vassal would improve with a courtesy gift."

 srd_prompt_title:0 "A Courtesy for a Disloyal Vassal"
 srd_prompt_desc:0 "One of your vassals holds a poor opinion of you. A gift would improve their disposition, at the cost of some gold from your treasury."
 srd_prompt_accept:0 "Send the gift"
 srd_prompt_decline:0 "Not now"
 srd_prompt_decline_tt:0 "Nothing is spent and the vassal is left as they are."

 srd_realm_report_decision:0 "Ask the Director for a Report"
 srd_realm_report_decision_desc:0 "Ask the Smart Realm Director what it is currently allowed to do in your realm."
 srd_realm_report_decision_tooltip:0 "Open the Director's status report."

 srd_report_title:0 "Smart Realm Director - Status"
 srd_report_desc:0 "The Director is installed and its modules answer to your game rules.\n\nSmart Vassals: courtesies to disloyal vassals. Off does nothing, Advisor only suggests, Supervised asks you first, and Automatic spends gold while keeping the treasury above its reserve floor.\n\nOnly actions confirmed in the installed game build are executed. Every other module is still under analysis and is listed in the project documentation."
 srd_report_option_close:0 "Understood"
