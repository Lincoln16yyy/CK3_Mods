name: static-checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static validation (structure, braces, localization, references)
        run: python3 tools/validate.py
      # This workflow proves static consistency only. It cannot run CK3, so it never
      # reports runtime behaviour. See docs/TEST_PLAN.md for levels B and C.
